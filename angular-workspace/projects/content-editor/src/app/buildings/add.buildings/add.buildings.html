<mat-card appearance="outlined">
  <mat-card-header></mat-card-header>
  <mat-card-content>
    <mat-stepper #stepper>
      <mat-step [stepControl]="firstCreateForm" errorMessage="Fill out required fields.">
        <form [formGroup]="firstCreateForm">
          <ng-template matStepLabel>Overall information</ng-template>
          <mat-form-field>
            <mat-label>Name</mat-label>
            <input matInput formControlName="name">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Year Built</mat-label>
            <input matInput formControlName="year_built">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Total Floors</mat-label>
            <input matInput formControlName="total_floors">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Total Units</mat-label>
            <input matInput formControlName="total_units">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" cols="10" rows="12"></textarea>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Status</mat-label>
            <select
              matNativeControl
              formControlName="status">
                @for (status of buildingStatus(); track status) {
                  <option [value]="status">
                    {{status}}
                  </option>
                }
            </select>
          </mat-form-field>

          <mat-checkbox formControlName="published">Publish</mat-checkbox>

          <button mat-button
            [disabled]="!firstCreateForm.valid"
            matStepperNext>
            Next
          </button>
        </form>
      </mat-step>
      <mat-step [stepControl]="secondCreateForm" errorMessage="Fill out required fields.">
        <form [formGroup]="secondCreateForm">
          <mat-form-field>
            <mat-label>Street</mat-label>
            <input matInput formControlName="street">
          </mat-form-field>
          <mat-form-field>
            <mat-label>House Number</mat-label>
            <input matInput formControlName="house_number">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Postal Code</mat-label>
            <input matInput formControlName="postal_code">
          </mat-form-field>
          <mat-form-field>
            <mat-label>City</mat-label>
            <input matInput formControlName="city">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Country</mat-label>
            <input matInput formControlName="country">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Latitude</mat-label>
            <input matInput formControlName="latitude">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Longitude</mat-label>
            <input matInput formControlName="longitude">
          </mat-form-field>

          <button mat-raised-button [disabled]="!secondCreateForm.valid" (click)="save()">
            Save
          </button>
          <button mat-flat-button (click)="cancel()">
            Cancel
          </button>
        </form>
      </mat-step>
    </mat-stepper>
  </mat-card-content>
</mat-card>
