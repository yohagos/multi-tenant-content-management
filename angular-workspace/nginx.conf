server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html/shell;
        try_files $uri $uri/ /index.html;
    }

    location /tenant-admin/ {
        alias /usr/share/nginx/html/tenant-admin/;
        try_files $uri $uri/ /tenant-admin/index.html;
    }

    location /content-editor/ {
        alias /usr/share/nginx/html/content-editor/;
        try_files $uri $uri/ /content-editor/index.html;
    }

    location /public-view/ {
        alias /usr/share/nginx/html/public-view/;
        try_files $uri $uri/ /public-view/index.html;
    }

    location /api/ {
        proxy_pass http://go-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://go-api:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
